# 会员配置模板 —— init 时拷成 user/profile.yaml，然后逐项填自己的值。
#
# 这里的每一项都是「因人而异」的：产品内核不预设任何默认取值，
# 空着＝还没跟会员对齐，不是"随便填也能跑"。新会员从空起，不继承任何前一位会员的配置。

member_id: ""           # 实例标识（自取，唯一即可）
display_name: ""        # 会员称呼；也用作产出物署名

focus_domain: ""        # 本轮聚焦领域，初始化时与会员当面对齐（不是替他猜）
                        # 作用：把"四大领域宽口径"收窄到这位会员真正在追的问题上

domain_weight: {}       # 各领域关注配比，供「实际推送分布 vs 应有比例」的偏离读数。
                        # 缺省等权＝不预设倾向。这是判断维度不是机械约束，偏离看到就好。
                        # 例（填自己的，别照抄）：
                        #   domain_weight:
                        #     ICT: 3
                        #     经济: 2
                        #     法律: 1
                        #     医学: 1

source_preference:      # 信谁 / 忌讳谁——这位会员要的 ≠ 别人要的，所以不用全局单一信源池
  trust: []
  avoid: []

score_baseline: ""      # 该会员的评分基线/分布。必须是这位会员自己的读数，
                        # 不能沿用别人的"满意度门槛"当默认——一人的基线不代表另一人。

landing_criteria: ""    # 该会员认什么算"读有所获、产生了真实决定"
                        # 跑前必须与会员对齐（不对齐就掉进"推送成功≠有价值"陷阱）

timezone: ""            # 会员所在时区 + 期望的每日推送时刻（别写死某个固定钟点）
timezone_offset_hours: ""   # 快照脚本展示用的时区偏移，如 8 表示 UTC+8；留空＝跟随本机时区

push_channel: ""        # 投递渠道与格式（别写死某个具体 IM 的固定名称）
push_via_bot: ""        # 推送方 agentId = 部署者本人（伴读者），不是本工具的作者
                        # 会员应该从伴读者的 bot 看到推送，而不是从工具作者那里看到
